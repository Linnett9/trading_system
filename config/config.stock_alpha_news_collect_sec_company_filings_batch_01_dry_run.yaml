  stock_alpha_news_collect_output_path: reports/ml/benchmark/regime_transformer_meta_ensemble_v1/stock_alpha_news_collect_sec_company_filings_batch_01_dry_run/dev/sec_company_filings_dry_run_rows.csv
  stock_alpha_news_collect:
