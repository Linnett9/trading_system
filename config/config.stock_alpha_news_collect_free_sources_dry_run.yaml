ml:
  stock_alpha_news_collect_report_dir: reports/ml/benchmark/regime_transformer_meta_ensemble_v1/stock_alpha_news_collect_free_sources_dry_run/dev
  stock_alpha_news_collect_output_path: data/news/raw/stock_alpha_news_provider_export.csv
  stock_alpha_news_collect:
    enabled: true
    dry_run: true
    allow_overwrite: false
    max_articles_per_provider: 50
    request_timeout_seconds: 20
    start_date: '2024-01-01'
    end_date: '2024-01-07'
    symbols: [AAPL, MSFT]
    providers:
      gdelt: {enabled: false}
      alpha_vantage: {enabled: true, api_key_env: ALPHA_VANTAGE_API_KEY}
      finnhub: {enabled: true, api_key_env: FINNHUB_API_KEY}
      fmp: {enabled: true, api_key_env: FMP_API_KEY}
      newsapi: {enabled: true, api_key_env: NEWSAPI_API_KEY}
  stock_alpha_news_enable_transformer: false
  research_only: true
  trading_impact: none
  production_validated: false
  promotion_thresholds_changed: false
