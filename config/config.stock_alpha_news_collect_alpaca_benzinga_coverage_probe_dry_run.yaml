ml:
  stock_alpha_news_collect_report_dir: reports/ml/benchmark/regime_transformer_meta_ensemble_v1/stock_alpha_news_collect_alpaca_benzinga_coverage_probe/dev
  stock_alpha_news_collect_output_path: reports/ml/benchmark/regime_transformer_meta_ensemble_v1/stock_alpha_news_collect_alpaca_benzinga_coverage_probe/dev/alpaca_benzinga_probe_rows.csv
  stock_alpha_news_collect:
    probe_kind: historical_coverage_probe
    enabled: true
    dry_run: true
    allow_overwrite: false
    merge_existing: false
    backup_existing: false
    start_date: "2024-01-01"
    end_date: "2024-03-31"
    active_window_id: "2024_q1"
    probe_windows:
      - {id: "2016_q1", start_date: "2016-01-01", end_date: "2016-03-31"}
      - {id: "2020_q1", start_date: "2020-01-01", end_date: "2020-03-31"}
      - {id: "2024_q1", start_date: "2024-01-01", end_date: "2024-03-31"}
      - {id: "2026_q1", start_date: "2026-01-01", end_date: "2026-03-31"}
    symbols: [AAPL, MSFT, NVDA, AMZN, JPM, XOM]
    symbols_per_batch: 3
    max_articles_per_provider: 25
    provider_request_limit: 25
    max_rows_per_provider: 50
    max_symbols_per_run: 6
    rate_limit_sleep_seconds: 1.0
    request_timeout_seconds: 20
    providers:
      alpaca_benzinga:
        enabled: true
        api_key_env: ALPACA_API_KEY_ID
        secret_key_env: ALPACA_SECRET_KEY
        max_pages_per_batch: 2
        max_retries: 1
        retry_sleep_seconds: 1.0
  stock_alpha_news_enable_transformer: false
