ml:
  historical_bar_backfill:
    provider: alpaca
    feed: iex
    timeframe: 5m
    symbols: [SPY, AAPL, MSFT]
    start: "2026-06-24T13:30:00+00:00"
    end: "2026-06-30T21:00:00+00:00"
    symbol_batch_size: 3
    date_window_days: 10
    limit: 10000
    adjustment: all
    extended_hours: false
    requests_per_minute: 180
    max_in_flight_requests: 1
    max_retries: 2
    dry_run: false
    resume: true
    force_refresh: false
    write_raw: false
    write_normalized_staging: true
    canonical_market_data_writes_enabled: false
    raw_root: data/raw/alpaca/stock_bars
    output_root: reports/market_data/historical_bar_backfill/5m_matched_iex_staging
