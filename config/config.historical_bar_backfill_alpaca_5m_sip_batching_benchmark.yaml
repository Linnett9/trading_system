ml:
  historical_bar_backfill:
    provider: alpaca
    feed: sip
    timeframe: 5m
    symbols: [SPY, AAPL, MSFT, QQQ, NVDA, AMZN, GOOGL, META, TSLA, JPM]
    start: "2026-06-24T13:30:00+00:00"
    end: "2026-06-30T21:00:00+00:00"
    benchmark_symbol_batch_sizes: [1, 5, 10]
    benchmark_date_window_days: [1, 5]
    benchmark_max_symbols: 10
    benchmark_max_chunks_per_alternative: 2
    requests_per_minute: 180
    max_in_flight_requests: 4
    max_retries: 2
    canonical_market_data_writes_enabled: false
    output_root: reports/market_data/historical_bar_backfill/5m_sip_batching_benchmark
