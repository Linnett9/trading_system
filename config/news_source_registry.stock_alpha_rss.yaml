_metadata:
  purpose: official RSS / press-release source tracking for stock-alpha news collection
  registry_scope: first_25_expansion_batch
  universe_source_config: config/config.stock_alpha_news_collect_alpha_vantage_sec_edgar_200symbol_dry_run.yaml
  expansion_batch_config: config/config.stock_alpha_news_collect_company_press_release_rss_25symbol_dry_run.yaml
  statuses:
    - verified
    - no_verified_rss
    - needs_manual_review
    - feed_error
    - disabled
  notes: "Only official/company-owned RSS feeds are enabled. Third-party press-release wires are excluded unless the company-owned site exposes that feed directly."
AAPL:
  company_name: Apple Inc.
  status: verified
  sources:
    - type: newsroom_rss
      name: Apple Newsroom
      url: https://www.apple.com/newsroom/rss-feed.rss
