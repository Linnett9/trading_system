ml:
  stock_alpha_news_historical_backfill:
    action: collect
    dry_run: false
    work_dir: reports/ml/benchmark/regime_transformer_meta_ensemble_v1/stock_alpha_news_historical_backfill_alpaca_benzinga_pilot/dev
    provider: alpaca_benzinga
    start_date: "2016-01-01"
    end_date: "2016-01-31"
    partition_frequency: monthly
    symbols: [AAPL, MSFT, NVDA, AMZN, JPM, XOM]
    symbol_batch_size: 3
    max_symbols: 6
    max_partitions_per_run: 1
    provider_request_limit: 250
    max_rows_per_partition: 2000
    request_timeout_seconds: 20
    rate_limit_sleep_seconds: 1.0
    provider_config:
      enabled: true
      api_key_env: ALPACA_API_KEY_ID
      secret_key_env: ALPACA_SECRET_KEY
      page_size: 50
      max_pages_per_batch: 40
      max_retries: 1
      retry_sleep_seconds: 1.0
  stock_alpha_news_enable_transformer: false
  research_only: true
  trading_impact: none
  production_validated: false
