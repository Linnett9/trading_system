ml:
  historical_bar_backfill:
    provider: alpaca
    feed: iex
    timeframe: 5m
    symbols: [SPY, AAPL, MSFT]
    max_symbols: 3
    probe_days: 1
    limit: 10000
    adjustment: all
    extended_hours: false
    requests_per_minute: 180
    max_in_flight_requests: 4
    output_root: reports/market_data/historical_bar_backfill/credential_probe
