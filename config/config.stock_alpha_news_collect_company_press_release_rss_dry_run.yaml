ml:
  stock_alpha_news_collect_report_dir: reports/ml/benchmark/regime_transformer_meta_ensemble_v1/stock_alpha_news_collect_company_press_release_rss_dry_run/dev
  stock_alpha_news_collect_output_path: data/news/raw/stock_alpha_news_provider_export.csv
  stock_alpha_news_collect:
    enabled: true
    dry_run: true
    allow_overwrite: false
    merge_existing: false
    backup_existing: false
    max_articles_per_provider: 140
    max_rows_per_provider: 200
    max_rows_per_feed: 20
    provider_request_limit: 140
    symbols_per_batch: 7
    max_symbols_per_run: 7
    only_symbols: []
    rate_limit_sleep_seconds: 0.5
    request_timeout_seconds: 20
    start_date: '2026-04-01'
    end_date: '2026-07-02'
    symbols: [AAPL, MSFT, NVDA, TSLA, AMZN, META, GOOGL]
    providers:
      company_press_release_rss:
        enabled: true
        max_rows_per_feed: 20
        max_enabled_feeds_per_run: 6
        skip_known_error_feeds: false
        feeds:
          AAPL:
            - name: Apple Newsroom
              url: "https://www.apple.com/newsroom/rss-feed.rss"
              enabled: true
              event_type: rss_news
              verified_source_url: "https://www.apple.com/newsroom/"
          MSFT:
            - name: Microsoft Source
              url: "https://news.microsoft.com/source/feed/"
              enabled: true
              event_type: rss_news
              verified_source_url: "https://news.microsoft.com/source/"
          NVDA:
            - name: NVIDIA Press Room
              url: "https://nvidianews.nvidia.com/releases.xml"
              enabled: true
              event_type: press_release
              verified_source_url: "https://www.nvidia.com/en-us/about-nvidia/rss/"
          TSLA:
            - name: Tesla Investor Relations RSS unavailable
              enabled: false
              event_type: press_release
              verified_source_url: "https://ir.tesla.com/press"
              note: "Official Tesla blog and IR press pages were checked, but no official RSS feed URL was verified; candidate feed endpoints returned 403, 404, or 503 during curation."
          AMZN:
            - name: Amazon News
              url: "https://www.aboutamazon.com/rss/feed.rss"
              enabled: true
              event_type: rss_news
              verified_source_url: "https://www.aboutamazon.com/news"
          META:
            - name: Meta Newsroom
              url: "https://about.fb.com/news/feed/"
              enabled: true
              event_type: rss_news
              verified_source_url: "https://about.fb.com/news/"
          GOOGL:
            - name: Google Blog Alphabet
              url: "https://blog.google/alphabet/rss/"
              enabled: true
              event_type: rss_news
              verified_source_url: "https://blog.google/alphabet/"
      alpha_vantage: {enabled: false, api_key_env: ALPHA_VANTAGE_API_KEY}
      sec_edgar: {enabled: false}
      massive_stock_news:
        enabled: false
        api_key_env: MASSIVE_API_KEY
        api_key_env_fallbacks: [POLYGON_API_KEY]
      finnhub: {enabled: false, api_key_env: FINNHUB_API_KEY}
      gdelt: {enabled: false}
      fmp: {enabled: false, api_key_env: FMP_API_KEY}
      newsapi: {enabled: false, api_key_env: NEWSAPI_API_KEY}
  stock_alpha_news_enable_transformer: false
  research_only: true
  trading_impact: none
  production_validated: false
  promotion_thresholds_changed: false
