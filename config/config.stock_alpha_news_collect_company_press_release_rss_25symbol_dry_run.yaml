      finnhub: {enabled: false, api_key_env: FINNHUB_API_KEY}
      gdelt: {enabled: false}
      fmp: {enabled: false, api_key_env: FMP_API_KEY}
      newsapi: {enabled: false, api_key_env: NEWSAPI_API_KEY}
