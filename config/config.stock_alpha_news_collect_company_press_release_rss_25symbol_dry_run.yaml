ml:
  stock_alpha_news_collect_report_dir: reports/ml/benchmark/regime_transformer_meta_ensemble_v1/stock_alpha_news_collect_company_press_release_rss_25symbol_dry_run/dev
  stock_alpha_news_collect_output_path: data/news/raw/stock_alpha_news_provider_export.csv
  stock_alpha_news_collect:
    enabled: true
    dry_run: true
    allow_overwrite: false
    merge_existing: false
    backup_existing: false
    source_registry_path: config/news_source_registry.stock_alpha_rss.yaml
    max_articles_per_provider: 250
    max_rows_per_provider: 250
    max_rows_per_feed: 10
    provider_request_limit: 250
    symbols_per_batch: 25
    max_symbols_per_run: 25
    only_symbols: []
    rate_limit_sleep_seconds: 0.5
    request_timeout_seconds: 20
    start_date: '2026-04-01'
    end_date: '2026-07-02'
    symbols: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, AVGO, BRK.B, JPM, V, MA, XOM, UNH, COST, HD, PG, JNJ, ABBV, NFLX, CRM, AMD, ORCL, BAC, KO]
    providers:
      company_press_release_rss:
        enabled: true
        max_rows_per_feed: 10
        max_enabled_feeds_per_run: 15
        skip_known_error_feeds: true
        feeds:
          AAPL:
            - name: Apple Newsroom
              url: "https://www.apple.com/newsroom/rss-feed.rss"
              enabled: true
              official: true
              event_type: rss_news
              verified_source_url: "https://www.apple.com/newsroom/"
          MSFT:
            - name: Microsoft Source
              url: "https://news.microsoft.com/source/feed/"
              enabled: true
              official: true
              event_type: rss_news
              verified_source_url: "https://news.microsoft.com/source/"
          NVDA:
            - name: NVIDIA Press Room
              url: "https://nvidianews.nvidia.com/releases.xml"
              enabled: true
              official: true
              event_type: press_release
              verified_source_url: "https://www.nvidia.com/en-us/about-nvidia/rss/"
          AMZN:
            - name: Amazon News
              url: "https://www.aboutamazon.com/rss/feed.rss"
              enabled: true
              official: true
              event_type: rss_news
              verified_source_url: "https://www.aboutamazon.com/news"
          GOOGL:
            - name: Google Blog Alphabet
              url: "https://blog.google/alphabet/rss/"
              enabled: true
              official: true
              event_type: rss_news
              verified_source_url: "https://blog.google/alphabet/"
          META:
            - name: Meta Newsroom
              url: "https://about.fb.com/news/feed/"
              enabled: true
              official: true
              event_type: rss_news
              verified_source_url: "https://about.fb.com/news/"
          TSLA:
            - name: Tesla Investor Relations RSS unavailable
              enabled: false
              event_type: press_release
              verified_source_url: "https://ir.tesla.com/press"
              note: "Official Tesla blog and IR press pages were checked, but no working official RSS endpoint was verified."
          AVGO:
            - name: Broadcom News Releases
              url: "https://investors.broadcom.com/rss/news-releases.xml"
              enabled: true
              official: true
              known_error: true
              last_error_observed: "2026-07-02"
              last_error_note: "25-symbol dry-run returned a feed-level error; keep URL official but skip by default until cleanup rerun."
              event_type: press_release
              verified_source_url: "https://investors.broadcom.com/financial-information/financial-news-releases"
          BRK.B:
            - name: Berkshire Hathaway RSS unavailable
